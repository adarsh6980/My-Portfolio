name: Deploy Azure

on:
  workflow_dispatch:
    inputs:
      deploy_infrastructure:
        description: 'Deploy infra/main.bicep to the existing resource group'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: portfolio-production
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 22

jobs:
  provision:
    name: Provision infrastructure
    if: ${{ inputs.deploy_infrastructure }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Bicep to the existing resource group
        env:
          SQL_ADMINISTRATOR_PASSWORD: ${{ secrets.AZURE_SQL_ADMINISTRATOR_PASSWORD }}
        run: |
          test -n "$SQL_ADMINISTRATOR_PASSWORD"
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters @infra/parameters/production.example.json \
            --parameters staticWebAppName="${{ vars.AZURE_STATIC_WEB_APP_NAME }}" \
            --parameters apiAppName="${{ vars.AZURE_WEBAPP_NAME }}" \
            --parameters sqlServerName="${{ vars.AZURE_SQL_SERVER_NAME }}" \
            --parameters sqlAdministratorPassword="$SQL_ADMINISTRATOR_PASSWORD"

  deploy:
    name: Deploy frontend and API
    needs: provision
    if: ${{ always() && (needs.provision.result == 'success' || needs.provision.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Validate all production inputs before mutation
        env:
          RESOURCE_GROUP_VALUE: ${{ vars.AZURE_RESOURCE_GROUP }}
          STATIC_WEB_APP_NAME_VALUE: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
          WEBAPP_NAME_VALUE: ${{ vars.AZURE_WEBAPP_NAME }}
          SQL_SERVER_NAME_VALUE: ${{ vars.AZURE_SQL_SERVER_NAME }}
          FRONTEND_API_URL_VALUE: ${{ vars.FRONTEND_API_URL }}
          FRONTEND_ORIGIN_VALUE: ${{ vars.FRONTEND_ORIGIN }}
          PORTFOLIO_SQL_CONNECTION: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          CONTACT_HASH_SALT_VALUE: ${{ secrets.CONTACT_HASH_SALT }}
        run: |
          required_values=(
            RESOURCE_GROUP_VALUE STATIC_WEB_APP_NAME_VALUE WEBAPP_NAME_VALUE SQL_SERVER_NAME_VALUE
            FRONTEND_API_URL_VALUE FRONTEND_ORIGIN_VALUE PORTFOLIO_SQL_CONNECTION CONTACT_HASH_SALT_VALUE
          )
          for value_name in "${required_values[@]}"; do
            test -n "${!value_name}"
          done
          [[ "$FRONTEND_API_URL_VALUE" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]
          [[ "$FRONTEND_ORIGIN_VALUE" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]
          [[ ${#CONTACT_HASH_SALT_VALUE} -ge 32 ]]
          normalized_salt="${CONTACT_HASH_SALT_VALUE,,}"
          [[ "$normalized_salt" != *development* ]]
          [[ "$normalized_salt" != *replace* ]]
          [[ "$normalized_salt" != *"[add"* ]]
          unique_character_count="$(printf %s "$CONTACT_HASH_SALT_VALUE" | fold -w1 | sort -u | wc -l | tr -d ' ')"
          (( unique_character_count >= 8 ))
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend with the production API URL
        working-directory: frontend
        env:
          # Required GitHub production environment variable; e.g. https://api.example.com.
          FRONTEND_API_URL: ${{ vars.FRONTEND_API_URL }}
        run: |
          test -n "$FRONTEND_API_URL"
          node -e "const fs = require('node:fs'); fs.writeFileSync('public/assets/config.js', 'globalThis.__PORTFOLIO_CONFIG__ = Object.freeze({ apiUrl: ' + JSON.stringify(process.env.FRONTEND_API_URL) + ' });\\n');"
          npm ci
          npm run build -- --configuration production
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore pinned .NET tooling
        run: dotnet tool restore
      - name: Restore backend dependencies
        run: dotnet restore backend/Portfolio.slnx
      - name: Reconcile SQL firewall rules for App Service outbound addresses
        run: |
          if az sql server firewall-rule show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --server "${{ vars.AZURE_SQL_SERVER_NAME }}" \
            --name AllowAzureServices --output none 2>/dev/null; then
            az sql server firewall-rule delete \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --server "${{ vars.AZURE_SQL_SERVER_NAME }}" \
              --name AllowAzureServices
          fi
          outbound_csv="$(az webapp show \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query possibleOutboundIpAddresses --output tsv)"
          test -n "$outbound_csv"
          keep_rules="|"
          IFS=',' read -ra outbound_ips <<< "$outbound_csv"
          for ip_address in "${outbound_ips[@]}"; do
            rule_name="portfolio-app-${ip_address//./-}"
            keep_rules="${keep_rules}${rule_name}|"
            az sql server firewall-rule create \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --server "${{ vars.AZURE_SQL_SERVER_NAME }}" \
              --name "$rule_name" \
              --start-ip-address "$ip_address" \
              --end-ip-address "$ip_address"
          done
          while IFS= read -r existing_rule; do
            if [[ -n "$existing_rule" && "$keep_rules" != *"|${existing_rule}|"* ]]; then
              az sql server firewall-rule delete \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --server "${{ vars.AZURE_SQL_SERVER_NAME }}" \
                --name "$existing_rule"
            fi
          done < <(az sql server firewall-rule list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --server "${{ vars.AZURE_SQL_SERVER_NAME }}" \
            --query "[?starts_with(name, 'portfolio-app-')].name" --output tsv)
      - name: Open a temporary SQL firewall rule for this runner
        id: sql-firewall
        run: |
          runner_ip="$(curl --fail --silent --show-error https://api.ipify.org)"
          rule_name="github-${{ github.run_id }}-${{ github.run_attempt }}"
          test -n "$runner_ip"
          az sql server firewall-rule create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --server "${{ vars.AZURE_SQL_SERVER_NAME }}" \
            --name "$rule_name" \
            --start-ip-address "$runner_ip" \
            --end-ip-address "$runner_ip"
          echo "rule_name=$rule_name" >> "$GITHUB_OUTPUT"
      - name: Apply pending database migrations
        env:
          PORTFOLIO_SQL_CONNECTION: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          Database__Provider: SqlServer
          ConnectionStrings__Portfolio: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
        run: |
          test -n "$PORTFOLIO_SQL_CONNECTION"
          dotnet ef migrations bundle \
            --project backend/src/Portfolio.Infrastructure/Portfolio.Infrastructure.csproj \
            --startup-project backend/src/Portfolio.Api/Portfolio.Api.csproj \
            --configuration Release \
            --output "$RUNNER_TEMP/portfolio-efbundle"
          "$RUNNER_TEMP/portfolio-efbundle" --connection "$PORTFOLIO_SQL_CONNECTION"
      - name: Remove the temporary SQL firewall rule
        if: ${{ always() && steps.sql-firewall.outputs.rule_name != '' }}
        run: |
          az sql server firewall-rule delete \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --server "${{ vars.AZURE_SQL_SERVER_NAME }}" \
            --name "${{ steps.sql-firewall.outputs.rule_name }}"
      - name: Publish API
        run: dotnet publish backend/src/Portfolio.Api/Portfolio.Api.csproj --configuration Release --output "$RUNNER_TEMP/api"
      - name: Configure API production settings
        env:
          PORTFOLIO_SQL_CONNECTION: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          CONTACT_HASH_SALT_VALUE: ${{ secrets.CONTACT_HASH_SALT }}
          FRONTEND_ORIGIN_VALUE: ${{ vars.FRONTEND_ORIGIN }}
        run: |
          test -n "$PORTFOLIO_SQL_CONNECTION"
          test -n "$CONTACT_HASH_SALT_VALUE"
          test -n "$FRONTEND_ORIGIN_VALUE"
          mapfile -t stale_cors_settings < <(az webapp config appsettings list \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "[?starts_with(name, 'Cors__AllowedOrigins__') && name != 'Cors__AllowedOrigins__0'].name" \
            --output tsv)
          if (( ${#stale_cors_settings[@]} > 0 )); then
            az webapp config appsettings delete \
              --name "${{ vars.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --setting-names "${stale_cors_settings[@]}" \
              --output none
          fi
          az webapp config appsettings delete \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --setting-names "ApplicationInsights__ConnectionString" \
            --output none
          az webapp config appsettings set \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --settings \
              "ASPNETCORE_ENVIRONMENT=Production" \
              "WEBSITE_RUN_FROM_PACKAGE=1" \
              "Database__Provider=SqlServer" \
              "Database__ApplyMigrationsOnStartup=false" \
              "ConnectionStrings__Portfolio=$PORTFOLIO_SQL_CONNECTION" \
              "Contact__HashSalt=$CONTACT_HASH_SALT_VALUE" \
              "Cors__AllowedOrigins__0=$FRONTEND_ORIGIN_VALUE" \
              "ReverseProxy__TrustForwardedHeaders=true" \
            --output none
      - name: Deploy API package
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ runner.temp }}/api
      - name: Verify deployed API readiness
        env:
          API_BASE_URL: ${{ vars.FRONTEND_API_URL }}
        run: |
          test -n "$API_BASE_URL"
          curl --fail --silent --show-error \
            --retry 8 --retry-delay 10 --retry-all-errors \
            "$API_BASE_URL/health/ready"
      - name: Obtain the Static Web Apps deployment token transiently through OIDC
        id: swa-token
        run: |
          token="$(az staticwebapp secrets list \
            --name "${{ vars.AZURE_STATIC_WEB_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.apiKey --output tsv)"
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      # The token is fetched during the OIDC-authenticated run, never saved as a repository secret.
      - name: Deploy Angular browser output to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          action: upload
          app_location: frontend/dist/frontend/browser
          skip_app_build: true
