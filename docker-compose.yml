services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        PORTFOLIO_API_URL: ${PORTFOLIO_API_URL:-http://localhost:5050}
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5050
      Database__Provider: Sqlite
      Database__ApplyMigrationsOnStartup: "true"
      ConnectionStrings__Portfolio: Data Source=/app/data/portfolio.db
      Cors__AllowedOrigins__0: http://localhost:8080
      Contact__HashSalt: ${CONTACT_HASH_SALT:?Set CONTACT_HASH_SALT to a unique value of at least 32 characters}
    ports:
      - "5050:5050"
    volumes:
      - portfolio-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5050/health/ready"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  portfolio-data:
