<div class="architecture-shell glass glass-blur hud-frame hud-scan">
  <div class="architecture-toolbar"><span></span><span></span><span></span><p>request-lifecycle.ts</p><b>● live</b></div>
  <div class="architecture-grid">
    @for (stage of stages(); track stage.id; let last = $last) {
      <button
        type="button"
        class="architecture-node glass"
        [class.is-active]="activeStage() === stage.id"
        [attr.data-architecture]="stage.id"
        [attr.aria-pressed]="activeStage() === stage.id"
        [attr.aria-controls]="'architecture-detail-' + stage.id"
        (click)="activeStage.set(stage.id)"
      >
        <span>{{ stage.technology }}</span>
        <strong>{{ stage.label }}</strong>
      </button>
      @if (!last) { <span class="architecture-arrow" aria-hidden="true">→</span> }
    }
  </div>
  <div aria-live="polite">
    @for (stage of stages(); track stage.id) {
      <p class="architecture-detail" [id]="'architecture-detail-' + stage.id" [hidden]="activeStage() !== stage.id"><span aria-hidden="true">●</span> {{ stage.detail }}</p>
    }
  </div>
  <div class="architecture-services" role="group" aria-label="Supporting Azure services">
    <span>Authentication</span><span>Key Vault</span><span>Application Insights</span><span>Azure App Service</span>
  </div>
</div>
